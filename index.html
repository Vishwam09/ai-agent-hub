<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Agent Hub</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      color: #111;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 14px;
      box-sizing: border-box;
      font-size: 16px;
      margin: 10px 0;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin: 5px;
    }

    .send {
      background: #111;
      color: white;
    }

    .speak {
      background: #ddd;
    }

    .stop {
      background: #ffdddd;
    }

    .card {
      background: white;
      padding: 20px;
      margin-top: 20px;
      border-radius: 15px;
    }

    #result {
      padding: 15px;
      background: #f0f0f0;
      border-radius: 10px;
      min-height: 40px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🤖 AI Agent Hub</h1>

    <p>Connect and manage multiple AI agents.</p>

    <!-- TASK -->
    <div class="card">

      <h2>💬 Task</h2>

      <input
        type="text"
        id="task"
        placeholder="Enter your task..."
      >

      <button class="send" onclick="sendTask()">
        🚀 Send Task
      </button>

    </div>


    <!-- AGENTS -->
    <div class="card">

      <h2>🤖 Agents</h2>

      <ul>
        <li>🧠 Manager AI</li>
        <li>🔎 Research AI</li>
        <li>💻 Coding AI</li>
        <li>🎨 Design AI</li>
        <li>🧪 Testing AI</li>
        <li>📝 Reviewer AI</li>
      </ul>

    </div>


    <!-- RESULT -->
    <div class="card">

      <h2>💬 Result</h2>

      <div id="result">
        Waiting for task...
      </div>

      <br>

      <button class="speak" onclick="speakResult()">
        🔊 Speak
      </button>

      <button class="stop" onclick="stopSpeaking()">
        ⏹ Stop
      </button>

      <p id="voiceStatus">
        Voice ready
      </p>

    </div>

  </div>


  <script>

    /*
     * VOICE RESPONSE
     */

    function speak(text) {

      if (!("speechSynthesis" in window)) {

        document.getElementById("voiceStatus").innerText =
          "Voice is not supported by this browser.";

        return;
      }


      // Stop previous speech
      window.speechSynthesis.cancel();


      const voice =
        new SpeechSynthesisUtterance(text);


      // Voice settings
      voice.lang = "en-US";

      // Natural speaking speed
      voice.rate = 0.95;

      // Slightly natural pitch
      voice.pitch = 1.05;

      voice.volume = 1;


      voice.onstart = function() {

        document.getElementById("voiceStatus").innerText =
          "🔊 Speaking...";

      };


      voice.onend = function() {

        document.getElementById("voiceStatus").innerText =
          "Voice ready";

      };


      window.speechSynthesis.speak(voice);

    }


    /*
     * SEND TASK
     */

    function sendTask() {

      const task =
        document.getElementById("task").value.trim();


      if (!task) {

        alert("Please enter your task.");

        return;
      }


      // Temporary AI response
      const response =
        "Your task has been received. " +
        "The AI Agent Hub is ready to process your request.";


      // Display response
      document.getElementById("result").innerText =
        response;


      // Automatically speak response
      speak(response);

    }


    /*
     * SPEAK RESULT BUTTON
     */

    function speakResult() {

      const text =
        document.getElementById("result").innerText;


      if (!text ||
          text === "Waiting for task...") {

        alert("There is no result to speak.");

        return;
      }


      speak(text);

    }


    /*
     * STOP SPEAKING
     */

    function stopSpeaking() {

      window.speechSynthesis.cancel();

      document.getElementById("voiceStatus").innerText =
        "Voice stopped";

    }

  </script>

</body>

</html>
